name: CI - Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tiny repo
        uses: actions/checkout@v4

      - name: Set image tag (short SHA)
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: krapi0314/tiny-web:${{ env.IMAGE_TAG }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://tiny-api.kevinprk.com

      - name: Checkout homeserver repo
        uses: actions/checkout@v4
        with:
          repository: krapie/homeserver
          token: ${{ secrets.GITOPS_TOKEN }}
          path: homeserver

      - name: Update image tag in deployment manifest
        run: |
          sed -i "s|krapi0314/tiny-web:.*|krapi0314/tiny-web:${{ env.IMAGE_TAG }}|" \
            homeserver/k8s/web/deployment.yaml

      - name: Commit and push manifest update
        run: |
          cd homeserver
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/web/deployment.yaml
          # No-op when k8s/web does not reference this image yet (first deploy).
          git diff --cached --quiet && { echo "manifest unchanged"; exit 0; }
          git commit -m "deploy: tiny-web ${{ env.IMAGE_TAG }}"
          for i in 1 2 3 4 5; do
            git push && break
            git pull --rebase
            sleep $((RANDOM % 5 + 3))
          done
